<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDS SCIENCE - Enter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="science-orb orb-one"></div>
    <div class="science-orb orb-two"></div>

    <main class="login-container">

        <div class="science-logo">
            🔬
        </div>

        <div class="login-card">

            <div class="brand-small">
                KIDS SCIENCE
            </div>

            <h1>
                ENTER THE<br>
                <span>SCIENCE WORLD</span>
            </h1>

            <p class="login-description">
                Learn. Explore. Discover.
            </p>

            <label for="scienceName">
                Scientist nickname
            </label>

            <input
                id="scienceName"
                type="text"
                maxlength="16"
                placeholder="Enter your nickname"
                autocomplete="off"
            >

            <button
                id="enterScienceBtn"
                class="shine-button"
                type="button"
            >
                ENTER SCIENCE WORLD
                <span>→</span>
            </button>

            <p id="loginError" class="login-error"></p>

            <div class="login-bottom">
                🧪 Safe learning • 🚀 Fun discovery • 🌎 Explore science
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
