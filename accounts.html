
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KIDS SCIENCE - Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: #e8f6ff;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(0,130,255,.25),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #010817,
                    #031b3d 50%,
                    #062d62
                );
        }

        .header {
            min-height: 76px;
            padding: 13px 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(2,19,43,.96);

            border-bottom:
                1px solid rgba(70,180,255,.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            color: white;
            font-size: 23px;
            font-weight: 900;

            text-shadow:
                0 0 10px #168cff;
        }

        .logo-icon {
            width: 45px;
            height: 45px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    white 5%,
                    #62c8ff 25%,
                    #168cff 55%,
                    #04306b
                );

            box-shadow:
                0 0 18px #168cff;
        }

        .nav {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .nav a {
            color: #cdeaff;
            text-decoration: none;

            padding: 10px 13px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;
        }

        .nav a:hover,
        .nav a.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0759b8,
                    #168cff
                );

            box-shadow:
                0 0 15px rgba(22,140,255,.35);
        }

        .page {
            width: min(1000px, calc(100% - 28px));
            margin: 40px auto;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            color: white;
            font-size: clamp(32px,6vw,52px);

            text-shadow:
                0 0 15px #168cff;
        }

        .title p {
            color: #87a9ca;
            margin-top: 7px;
        }

        .account-card {
            padding: 30px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(5,52,106,.85),
                    rgba(2,15,34,.97)
                );

            border:
                1px solid rgba(70,180,255,.3);

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 22px;

            padding-bottom: 25px;

            border-bottom:
                1px solid rgba(70,180,255,.2);
        }

        .avatar {
            width: 100px;
            height: 100px;

            flex: 0 0 auto;

            display: grid;
            place-items: center;

            border-radius: 50%;

            font-size: 52px;

            background:
                radial-gradient(
                    circle at 30% 20%,
                    white,
                    #62c8ff 25%,
                    #0871dd 60%,
                    #03265a
                );

            border:
                2px solid rgba(116,210,255,.8);

            box-shadow:
                0 0 25px rgba(22,140,255,.65);
        }

        .name {
            color: white;
            font-size: 28px;
            font-weight: 900;
        }

        .uid {
            margin-top: 6px;
            color: #72b8e9;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3,1fr);

            gap: 14px;

            margin-top: 25px;
        }

        .stat {
            padding: 20px;

            border-radius: 16px;

            background: rgba(4,32,67,.7);

            border:
                1px solid rgba(70,180,255,.2);
        }

        .stat-label {
            color: #7094b8;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 8px;

            color: white;

            font-size: 25px;
            font-weight: 900;
        }

        .actions {
            display: flex;
            gap: 12px;

            margin-top: 25px;
        }

        .button {
            flex: 1;

            height: 50px;

            border: 0;
            border-radius: 12px;

            color: white;

            font-weight: 900;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #0759b8,
                    #168cff
                );
        }

        .button.danger {
            background:
                linear-gradient(
                    135deg,
                    #7d1827,
                    #d83b4d
                );
        }

        .transactions {
            margin-top: 25px;

            padding-top: 25px;

            border-top:
                1px solid rgba(70,180,255,.2);
        }

        .transactions h2 {
            margin-bottom: 14px;
            color: white;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            padding: 13px 0;

            border-bottom:
                1px solid rgba(70,180,255,.1);

            font-size: 13px;
        }

        .transaction-name {
            color: #b7d8f3;
        }

        .transaction-amount {
            color: #64d9ff;
            font-weight: 900;
            white-space: nowrap;
        }

        .not-logged {
            padding: 35px;
            text-align: center;

            border-radius: 20px;

            background: rgba(2,20,44,.8);

            border:
                1px solid rgba(70,180,255,.25);
        }

        .not-logged h2 {
            color: white;
            margin-bottom: 10px;
        }

        .not-logged p {
            color: #82a6c9;
            margin-bottom: 20px;
        }

        .not-logged a {
            display: inline-block;

            padding: 13px 25px;

            color: white;
            text-decoration: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #0759b8,
                    #168cff
                );
        }

        @media(max-width:700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 13px 16px;
            }

            .nav {
                width: 100%;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .nav a {
                white-space: nowrap;
            }

            .profile {
                flex-direction: column;
                text-align: center;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .account-card {
                padding: 20px;
            }
        }

    </style>

</head>


<body data-page="accounts">


<header class="header">

    <div class="logo">

        <div class="logo-icon">
            🔬
        </div>

        KIDS SCIENCE

    </div>


    <nav class="nav">

        <a href="index.html">
            Home
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="projects.html">
            Projects
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="videos.html">
            Videos
        </a>

        <a href="chat.html">
            Live Chat
        </a>

        <a
            href="accounts.html"
            class="active"
        >
            Account
        </a>

    </nav>

</header>


<main class="page">

    <div class="title">

        <h1>
            👨‍🔬 My Science Account
        </h1>

        <p>
            Your saved KIDS SCIENCE account information.
        </p>

    </div>


    <div
        id="accountArea"
        class="account-card"
    ></div>

</main>


<script src="script.js"></script>

</body>

</html>
